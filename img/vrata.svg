<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" role="img" aria-labelledby="t d">
  <title id="t">Vrata dílny CO₂ Klima</title>
  <desc id="d">Nákres sekčních vrat dílny: šířka 3,58 m, výška 3,90 m.</desc>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6cc70a"/>
    </marker>
  </defs>
  <!-- stěna -->
  <rect x="20" y="20" width="420" height="390" fill="#151515" stroke="#2c2c2c" stroke-width="2"/>
  <!-- vrata -->
  <g transform="translate(70 60)">
    <rect width="320" height="350" fill="#1f1f1f" stroke="#bdbfb7" stroke-width="3"/>
    <g stroke="#3a3a3a" stroke-width="2">
      <line x1="0" y1="58" x2="320" y2="58"/><line x1="0" y1="116" x2="320" y2="116"/>
      <line x1="0" y1="175" x2="320" y2="175"/><line x1="0" y1="233" x2="320" y2="233"/>
      <line x1="0" y1="291" x2="320" y2="291"/>
    </g>
    <rect x="135" y="315" width="50" height="8" rx="3" fill="#bdbfb7"/>
  </g>
  <!-- podlaha -->
  <line x1="0" y1="410" x2="520" y2="410" stroke="#bdbfb7" stroke-width="3"/>
  <!-- šířka -->
  <line x1="70" y1="432" x2="390" y2="432" stroke="#6cc70a" stroke-width="3" marker-start="url(#s)" marker-end="url(#s)"/>
  <rect x="160" y="414" width="140" height="36" rx="6" fill="#000"/>
  <text x="230" y="441" fill="#fff" font-family="Lexend, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">3,58 m</text>
  <!-- výška -->
  <line x1="470" y1="60" x2="470" y2="410" stroke="#6cc70a" stroke-width="3" marker-start="url(#s)" marker-end="url(#s)"/>
  <g transform="translate(470 235) rotate(-90)">
    <rect x="-70" y="-18" width="140" height="36" rx="6" fill="#000"/>
    <text x="0" y="9" fill="#fff" font-family="Lexend, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">3,90 m</text>
  </g>
</svg>
