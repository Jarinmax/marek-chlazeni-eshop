<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="t d">
  <title id="t">Vrata dílny CO₂ Klima</title>
  <desc id="d">Nákres vjezdových vrat dílny: šířka 3,58 m, výška 3,90 m.</desc>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6cc70a"/>
    </marker>
    <linearGradient id="podlaha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="strop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/><stop offset="1" stop-color="#1e1e1e"/>
    </linearGradient>
  </defs>
  <!-- šířka -->
  <line x1="42" y1="18" x2="282" y2="18" stroke="#6cc70a" stroke-width="3" marker-start="url(#s)" marker-end="url(#s)"/>
  <!-- otvor vrat (poměr 3,58 : 3,90) -->
  <g>
    <rect x="42" y="38" width="240" height="262" fill="url(#strop)"/>
    <!-- pohled do dílny -->
    <polygon points="42,300 282,300 222,200 102,200" fill="url(#podlaha)"/>
    <polygon points="42,38 102,110 102,200 42,300" fill="#181818"/>
    <polygon points="282,38 222,110 222,200 282,300" fill="#181818"/>
    <rect x="102" y="110" width="120" height="90" fill="#262626"/>
    <g fill="#9fb3c8" opacity=".55">
      <rect x="132" y="128" width="16" height="40"/><rect x="152" y="128" width="16" height="40"/><rect x="172" y="128" width="16" height="40"/>
    </g>
    <g stroke="#e8e8e8" stroke-width="3" stroke-linecap="round" opacity=".85">
      <line x1="80" y1="62" x2="118" y2="62"/><line x1="206" y1="62" x2="244" y2="62"/>
      <line x1="110" y1="88" x2="136" y2="88"/><line x1="188" y1="88" x2="214" y2="88"/>
    </g>
    <g stroke="#e0c341" stroke-width="2" opacity=".7">
      <line x1="122" y1="300" x2="146" y2="200"/><line x1="202" y1="300" x2="178" y2="200"/>
    </g>
    <rect x="42" y="38" width="240" height="262" fill="none" stroke="#6cc70a" stroke-width="5"/>
  </g>
  <!-- výška -->
  <line x1="316" y1="38" x2="316" y2="300" stroke="#6cc70a" stroke-width="3" marker-start="url(#s)" marker-end="url(#s)"/>
  <line x1="0" y1="302" x2="360" y2="302" stroke="#5a5a5a" stroke-width="2"/>
</svg>
